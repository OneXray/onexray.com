baseURL = 'https://onexray.com/'
title = 'OneXray'
defaultContentLanguage = 'en'

disablePathToLower = true
enableGitInfo = true
enableRobotsTXT = true
hasCJKLanguage = true
disableKinds = ['taxonomy', 'term']

[outputFormats.Markdown]
  mediaType = 'text/markdown'
  baseName = 'index'
  isPlainText = true
  rel = 'alternate'

[outputFormats.LLMS]
  mediaType = 'text/plain'
  baseName = 'llms'
  isPlainText = true
  notAlternative = true

[outputFormats.LLMSFull]
  mediaType = 'text/plain'
  baseName = 'llms-full'
  isPlainText = true
  notAlternative = true

[outputs]
  home = ['HTML', 'RSS', 'LLMS', 'LLMSFull']
  page = ['HTML', 'Markdown']
  section = ['HTML', 'RSS', 'Markdown']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[languages]
  [languages.en]
    label = 'English'
    locale = 'en-US'
    contentDir = 'content.en'
    weight = 1
    [languages.en.params]
      description = 'An open-source Xray-core client with Smart Routing, custom rules, and Raw JSON for phones, tablets, and desktops.'
  [languages.zh]
    label = '中文'
    locale = 'zh-CN'
    contentDir = 'content.zh'
    weight = 2
    [languages.zh.params]
      description = 'OneXray 是开源 Xray-core 客户端，提供智能路由、自定义规则和 Raw JSON，适配手机、平板与桌面。'
  [languages.ru]
    label = 'Русский'
    locale = 'ru-RU'
    contentDir = 'content.ru'
    weight = 3
    [languages.ru.params]
      description = 'Открытый клиент Xray-core: умная маршрутизация, собственные правила и Raw JSON на телефонах, планшетах и компьютерах.'

[params]
  title = 'OneXray'
  description = 'An open-source Xray-core client with Smart Routing, custom rules, and Raw JSON for phones, tablets, and desktops.'
  images = ['/images/screenshots/connect-macos.png']
  externalLinkDecoration = true
  displayUpdatedDate = true
  dateFormat = 'January 2, 2006'

  [params.navbar]
    displayTitle = true
    displayLogo = true
    width = 'wide'
    [params.navbar.logo]
      path = 'logo.png'
      width = 32
      height = 32

  [params.theme]
    default = 'system'
    displayToggle = true

  [params.footer]
    enable = true
    displayCopyright = true
    displayPoweredBy = false
    width = 'wide'

  [params.search]
    enable = true
    type = 'flexsearch'
    [params.search.flexsearch]
      index = 'content'
      tokenize = 'forward'

  [params.page]
    displayPagination = true

  [params.highlight.copy]
    enable = true
    display = 'hover'

[module]
  [module.hugoVersion]
    extended = true
    min = '0.146.0'
  [[module.imports]]
    path = 'github.com/imfing/hextra'

[[menu.main]]
  identifier = 'ai-guide'
  name = 'Configure with AI'
  pageRef = '/docs/ai'
  weight = 0

[[menu.main]]
  identifier = 'documentation'
  name = 'Documentation'
  pageRef = '/docs'
  weight = 1

[[menu.main]]
  identifier = 'search'
  name = 'Search'
  weight = 2
  [menu.main.params]
    type = 'search'

[[menu.main]]
  identifier = 'github'
  name = 'GitHub'
  url = 'https://github.com/OneXray/OneXray'
  weight = 3
  [menu.main.params]
    icon = 'github'
